services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jojobuilds
      POSTGRES_DB: jojobuilds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your untracked root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jojobuilds -d jojobuilds"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  api:
    build: ./apps/api
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql+psycopg://jojobuilds:${POSTGRES_PASSWORD}@db:5432/jojobuilds
      WEB_ORIGIN: http://localhost:3000
      DATA_DIR: /app/data
      APP_ENV: development
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    profiles: ["app"]
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  uploads:
