[project]
name = "jojobuilds-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "httpx>=0.28,<1",
  "google-auth[requests]>=2.38,<3"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
